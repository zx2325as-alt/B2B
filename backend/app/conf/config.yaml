ai:
  # 默认使用的 AI 提供商
  default_provider: "deepseek"
  
  providers:
    # 1. 国外：OpenAI
    openai:
      base_url: "https://api.openai.com/v1"
      api_key: "sk-your-openai-key"
      models:
        simple: "gpt-4o-mini"
        medium: "gpt-4o"
        complex: "gpt-4o"
        
    # 2. 国内：DeepSeek
    deepseek:
      base_url: "https://api.deepseek.com/v1"
      api_key: "sk-803936ec8add440db0dca13ec660f070"
      models:
        simple: "deepseek-chat"
        medium: "deepseek-chat"
        complex: "deepseek-reasoner"
        
    # 3. 本地：Ollama
    ollama:
      base_url: "http://localhost:11434/v1"
      api_key: "ollama" # Ollama 不需要真实的 API Key
      models:
        simple: "llama3"
        medium: "llama3"
        complex: "llama3"
        
    # 4. 本地/集群：vLLM
    vllm:
      base_url: "http://localhost:8000/v1"
      api_key: "empty"
      models:
        simple: "Qwen2.5-7B-Instruct"
        medium: "Qwen2.5-14B-Instruct"
        complex: "Qwen2.5-32B-Instruct"
