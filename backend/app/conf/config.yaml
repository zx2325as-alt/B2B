ai:
  default_provider: "deepseek"
  # 主供应商连接/超时/限流/5xx 失败时，自动切到此 provider 重试一次（用其同级模型）。留空则不兜底。
  fallback_provider: "deepseek"
  task_providers:
    # ── 高价值深度任务 → n1n（claude-opus-4-8，心理/博弈推理）──
    multi_perspective_analysis: "n1n"      # 核心：每条消息的多视角分析 + 应对建议
    perspective_critic_revise: "n1n"       # 在分析之上的 critic 复核
    chat_analysis: "n1n"
    relationship_deep_analysis: "n1n"
    structured_diagnosis: "n1n"            # 深度诊断
    diagnosis_critic: "n1n"
    long_context_review: "n1n"             # 归档时的长上下文建模
    long_context_review_critic: "n1n"
    ai_suggest_update: "n1n"
    character_profile_gen: "n1n"
    import_profile_gen: "n1n"
    trait_hypothesis_update: "n1n"
    # ── 中等任务 → n1n（claude-sonnet-4-6，快且强）──
    relationship_analysis: "n1n"
    prediction_review: "n1n"               # 预演闭环对账
    goal_progress_review: "n1n"            # 目标进度评估
    # ── 粘贴/导入解析 → n1n（claude-sonnet-4-6，结构化抽取强、速度快）──
    import_dialogue_parse: "n1n"           # 整段粘贴的发言人归位
    import_narrative_parse: "n1n"
    quick_profile_infer: "n1n"             # 冷启动临时画像（用 sonnet，见 task_models）
    # ── 高频/格式化 → deepseek（便宜够用，不影响体验）──
    chat_surface_reply: "deepseek"
    import_profile_document_parse: "deepseek"
    import_commit_review: "deepseek"
    interaction_analysis_rebuild: "deepseek"
    interaction_batch_analysis: "deepseek"
    emotion_curve: "deepseek"
    context_summary: "deepseek"
  task_models:
    # 这些任务 latency 敏感（粘贴解析、冷启动画像内联在分析前），压回 sonnet 兼顾质量与速度
    import_dialogue_parse: "deepseek-chat"
    import_narrative_parse: "deepseek-chat"
    quick_profile_infer: "deepseek-chat"
    import_commit_review: "deepseek-chat"
    interaction_analysis_rebuild: "deepseek-chat"
  task_max_tokens:
    chat_analysis: 2048
    multi_perspective_analysis: 6144     # 不计成本：给 opus 更大输出，分析更充分
    perspective_critic_revise: 4096      # 自动复核留足空间
    import_dialogue_parse: 8192
    import_narrative_parse: 8192
    import_profile_document_parse: 8192
    import_commit_review: 4096
    relationship_deep_analysis: 3072
    trait_hypothesis_update: 2048
    interaction_analysis_rebuild: 3072
    interaction_batch_analysis: 8192
    import_profile_gen: 2048
    structured_diagnosis: 4096
    diagnosis_critic: 3072
    long_context_review: 8192
    long_context_review_critic: 3072
    relationship_analysis: 1536
    prediction_review: 1280
    goal_progress_review: 2048    # 含 segments 数组，opus 下留足空间防截断
    quick_profile_infer: 1024
    context_summary: 1024
  task_temperatures:
    import_dialogue_parse: 0.3
    import_narrative_parse: 0.3
    import_profile_document_parse: 0.2
    import_commit_review: 0.3
    relationship_deep_analysis: 0.4
    trait_hypothesis_update: 0.3
    interaction_analysis_rebuild: 0.4
    interaction_batch_analysis: 0.4
    import_profile_gen: 0.3
    structured_diagnosis: 0.3
    diagnosis_critic: 0.2
    long_context_review: 0.25
    long_context_review_critic: 0.15
    context_summary: 0.2
  # 每个任务的 LLM 调用超时（秒），未列出的任务用 default
  task_timeouts:
    default: 120
    chat_surface_reply: 90
    chat_analysis: 120
    multi_perspective_analysis: 180
    import_dialogue_parse: 180
    import_narrative_parse: 180
    import_profile_document_parse: 240
    import_commit_review: 180
    relationship_deep_analysis: 120
    trait_hypothesis_update: 120
    interaction_analysis_rebuild: 90
    interaction_batch_analysis: 300
    import_profile_gen: 120
    long_context_review: 300
    long_context_review_critic: 180
    context_summary: 90

  providers:
    openai:
      base_url: "https://api.openai.com/v1"
      # 密钥放 config.local.yaml（不入库），此处仅占位
      api_key: ""
      models:
        simple: "gpt-4o-mini"
        medium: "gpt-4o"
        complex: "gpt-4o"

    deepseek:
      base_url: "https://api.deepseek.com/v1"
      # 密钥放 config.local.yaml（不入库），此处仅占位
      api_key: ""
      models:
        simple: "deepseek-chat"
        medium: "deepseek-chat"
        complex: "deepseek-chat"

    # n1n.ai 聚合网关：OpenAI 兼容，一个 key 通所有模型；密钥在 config.local.yaml。
    # 分级：复杂深度任务用 claude-opus-4-8（心理/博弈推理最优），中等用 sonnet，简单用 deepseek。
    n1n:
      base_url: "https://hk.n1n.ai/v1"
      # 密钥放 config.local.yaml（不入库），此处仅占位
      api_key: ""
      models:
        # 不计成本·质量拉满：复杂/中等档 opus，简单档 sonnet；latency 敏感任务用 task_models 压回 sonnet
        simple: "claude-sonnet-4-6"
        medium: "claude-opus-4-8"
        complex: "claude-opus-4-8"

# 向量语义检索：记忆写入时算向量、检索时按余弦相似度参与打分。
# DeepSeek 无 embedding API，这里用任意 OpenAI 兼容 embedding 服务（默认 SiliconFlow bge-m3）。
# api_key 放在 config.local.yaml（不入库）；留空时自动静默回退到字面检索，零影响。
embedding:
  enabled: true
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: ""
  model: "text-embedding-v4"

graph:
  # Neo4j 图谱层（start.bat 会随项目启动 Neo4j；如不需要可改为 false，系统自动降级为纯 SQLite）
  enabled: true
  provider: "neo4j"
  uri: "bolt://127.0.0.1:7687"
  username: ""
  password: ""
  database: "neo4j"
  bundled_home: "backend/app/models/neo4j-community-5.18.1"

context:
  # 对话上下文 token 预算（不计成本/时间：claude-opus 支持长上下文，喂足历史）
  token_limit: 40000
  reserve_for_output: 2000
  # 超过该条数的旧消息进入滚动摘要（拉高 → 更多原始对话保留为上下文，不急着压成摘要）
  summary_trigger_messages: 60
  summary_keep_recent: 30
